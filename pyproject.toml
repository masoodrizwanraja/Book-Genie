[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-genie"
version = "0.1.0"
description = "A local-first foundation for author-directed book projects"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
book-genie = "book_genie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
